# Продакшен: docker compose -f docker-compose.prod.yml up -d --build
# Перед сборкой положите .env.production в корень проекта (образец: .env.example).
services:
  web:
    build:
      context: .
      target: runner
    image: southhub-web:latest
    container_name: southhub_prod

    env_file:
      - path: .env.production
        required: false

    ports:
      - "${PORT:-3000}:3000"

    restart: unless-stopped

    # Ограничения ресурсов
    mem_limit: 700m
    cpus: "1.0"

    # Безопасность: без привилегий и capabilities, корневая ФС только для чтения
    privileged: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true

    # Запись разрешена только во временные папки и кэш Next (картинки, страницы)
    tmpfs:
      - /tmp:mode=1777
      - /app/.next/cache:uid=1001,gid=1001,mode=0755

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

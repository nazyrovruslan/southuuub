services:
  web:
    build:
      context: .
      target: runner

    container_name: nextjs_prod

    env_file:
      - .env.production

    ports:
      - "3000:3000"

    restart: always

    # Ограничение памяти контейнера
    mem_limit: 700m

    # CPU limit (по желанию)
    cpus: "1.0"

    # Без привилегий
    privileged: false

    # Убираем Linux capabilities
    cap_drop:
      - ALL

    # Запрещаем повышение привилегий
    security_opt:
      - no-new-privileges:true

    # Root FS только для чтения
    read_only: true

    # tmpfs для временных файлов
    tmpfs:
      - /tmp:mode=1777
      - /app/.next/cache:uid=1000,gid=1000,mode=1777

    # healthcheck
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
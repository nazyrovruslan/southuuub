# Прод: docker compose -f docker-compose.prod.yml up -d --build
services:
  web:
    build:
      context: .
      target: runner

    container_name: southhub_prod

    # Необязательный файл: NUXT_PUBLIC_* из него переопределяют ссылки при запуске
    env_file:
      - path: .env.production
        required: false

    ports:
      - "3000:3000"

    restart: always

    # Ограничение памяти контейнера
    mem_limit: 700m

    # CPU limit (по желанию)
    cpus: "1.0"

    # Без привилегий
    privileged: false

    # Убираем Linux capabilities
    cap_drop:
      - ALL

    # Запрещаем повышение привилегий
    security_opt:
      - no-new-privileges:true

    # Root FS только для чтения
    read_only: true

    # tmpfs для временных файлов
    tmpfs:
      - /tmp:mode=1777

    # healthcheck
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

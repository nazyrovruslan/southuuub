# Прод: docker compose -f docker-compose.prod.yml up -d --build
# Сайт слушает 127.0.0.1:3333 и работает по пути /vue/ (nginx: location /vue/ { proxy_pass http://127.0.0.1:3333; }).
# Свои значения: HOST_PORT и BASE_URL в файле .env рядом с этим файлом.
# Имя проекта и контейнера отдельные, чтобы не пересекаться с контейнером Next-версии на том же сервере.
name: southhub-vue

services:
  web:
    build:
      context: .
      target: runner
      args:
        # путь сайта вшивается в сборку: все ссылки на /_nuxt/, картинки и видео начинаются с него
        NUXT_APP_BASE_URL: ${BASE_URL:-/vue/}

    container_name: southhub_vue

    # Необязательный файл: NUXT_PUBLIC_* из него переопределяют ссылки при запуске
    env_file:
      - path: .env.production
        required: false

    ports:
      # только localhost: наружу сайт отдаёт nginx/прокси на сервере; порт меняется переменной HOST_PORT
      - "127.0.0.1:${HOST_PORT:-3333}:3000"

    restart: always

    # Ограничение памяти контейнера
    mem_limit: 700m

    # CPU limit (по желанию)
    cpus: "1.0"

    # Без привилегий
    privileged: false

    # Убираем Linux capabilities
    cap_drop:
      - ALL

    # Запрещаем повышение привилегий
    security_opt:
      - no-new-privileges:true

    # Root FS только для чтения
    read_only: true

    # tmpfs для временных файлов
    tmpfs:
      - /tmp:mode=1777

    # healthcheck
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000${BASE_URL:-/vue/}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

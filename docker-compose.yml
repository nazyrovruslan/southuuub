# Разработка: docker compose up --build
# Сайт на http://localhost:3000, правки в app/ подхватываются на лету.
services:
  web:
    build:
      context: .
      target: dev
    container_name: southhub_dev
    ports:
      # только localhost: dev-сервер не предназначен для доступа извне
      - "127.0.0.1:3000:3000"
      # вебсокет горячей перезагрузки Vite
      - "127.0.0.1:24678:24678"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.nuxt
    environment:
      - NODE_ENV=development
      # в смонтированной папке события файлов не всегда доходят до контейнера
      - CHOKIDAR_USEPOLLING=true
